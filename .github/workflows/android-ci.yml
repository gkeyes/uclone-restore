name: Android CI

on:
  push:
    branches: ["main", "0.3", "0.4"]
  pull_request:
    branches: ["main", "0.3", "0.4"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/uclone-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uclone-signing/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/uclone-signing/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"

      - name: Require fixed release signing
        run: test "$HAS_RELEASE_SIGNING" = "true"

      - name: Run unit tests, lint, and compile every variant
        run: >-
          gradle --no-daemon
          :app:testDebugUnitTest
          :launcher-module:testDebugUnitTest
          :crossuser-api:testDebugUnitTest
          :crossuser-runtime:testDebugUnitTest
          :crossuser-probe-app:testDebugUnitTest
          :app:testReleaseUnitTest
          :launcher-module:testReleaseUnitTest
          :crossuser-api:testReleaseUnitTest
          :crossuser-runtime:testReleaseUnitTest
          :crossuser-probe-app:testReleaseUnitTest
          :app:lintDebug
          :launcher-module:lintDebug
          :crossuser-api:lintDebug
          :crossuser-runtime:lintDebug
          :crossuser-probe-app:lintDebug
          :app:lintRelease
          :launcher-module:lintRelease
          :crossuser-api:lintRelease
          :crossuser-runtime:lintRelease
          :crossuser-probe-app:lintRelease
          :app:assembleDebugAndroidTest
          :crossuser-probe-app:assembleDebugAndroidTest
          :app:assembleDebug
          :launcher-module:assembleDebug
          :crossuser-probe-app:assembleDebug
          :app:assembleRelease
          :launcher-module:assembleRelease
          :crossuser-probe-app:assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI contract tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Verify fixed release signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs launcher-module/build/outputs/apk/release/launcher-module-release.apk
          "$APKSIGNER" verify --verbose --print-certs crossuser-probe-app/build/outputs/apk/release/crossuser-probe-app-release.apk
          APP_DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          MODULE_DIGEST=$("$APKSIGNER" verify --print-certs launcher-module/build/outputs/apk/release/launcher-module-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          PROBE_DIGEST=$("$APKSIGNER" verify --print-certs crossuser-probe-app/build/outputs/apk/release/crossuser-probe-app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$APP_DIGEST"
          test -n "$MODULE_DIGEST"
          test -n "$PROBE_DIGEST"
          test "$APP_DIGEST" = "$MODULE_DIGEST"
          test "$APP_DIGEST" = "$PROBE_DIGEST"

      - name: Package commit-pinned preview artifacts
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/uclone-restore-0.4.0-rc.1-$SHORT_SHA-release.apk"
          cp launcher-module/build/outputs/apk/release/launcher-module-release.apk "dist/uclone-launcher-module-0.4.0-rc.1-$SHORT_SHA-release.apk"
          cp crossuser-probe-app/build/outputs/apk/release/crossuser-probe-app-release.apk "dist/uclone-crossuser-probe-0.4.0-rc.1-$SHORT_SHA-release.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf 'version=0.4.0-rc.1\ncommit=%s\nsigning=fixed-release\n' "$GITHUB_SHA" > dist/BUILD-MANIFEST.txt

      - name: Upload fixed-signed preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: uclone-0.4.0-rc.1-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error
